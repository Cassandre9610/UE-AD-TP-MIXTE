services:
  mongo-movie:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./movie/data:/seed:ro
      - ./movie/data/init.js:/docker-entrypoint-initdb.d/init.js:ro

  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    depends_on:
      - mongo-movie
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://root:example@mongo-movie:27017/

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - SCHEDULE_HOST=schedule:3002

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - MOVIE_SERVICE_HOST=movie:3001

  mongo-user:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./user/data:/seed:ro
      - ./user/data/init.js:/docker-entrypoint-initdb.d/init.js:ro

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    depends_on:
      - mongo-user
    ports:
      - "3004:3004"
    environment:
      - MONGO_URI=mongodb://root:example@mongo-user:27017/

